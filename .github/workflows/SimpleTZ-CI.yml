            HOME.mkdir(parents=True, exist_ok=True)
            with (HOME/'evidence.jsonl').open('a', encoding='utf-8') as f:
                f.write(json.dumps(record) + '\n')
            print('CMSIS_PACK_TEST_RESULT ' + json.dumps(record), flush=True)

        def wrapper():
            args = sys.argv[1:]
            real = (HOME/'real-cbuild.txt').read_text().strip()
            if not any('.csolution.' in a for a in args) or any(a in args for a in ['--help', '--version', 'list', 'clean']):
                return subprocess.call([real] + args)
            changed = prepare()
            def option(*names):
                return next((args[i+1] for i,a in enumerate(args[:-1]) if a in names), '')
            identity = json.dumps([str(Path.cwd()), next(a for a in args if '.csolution.' in a),
                                   option('-c','--context'),option('--toolchain'),option('--active'),option('-O','--output')])
            known_path=HOME/('known-'+hashlib.sha256(identity.encode()).hexdigest()+'.json')
            known=json.loads(known_path.read_text()) if known_path.exists() else {}
            before = {str(p): p.stat().st_mtime_ns for p in files() if p.name.endswith('.cbuild.yml')}
            started = time.time()
