      if: always()
      shell: bash
      working-directory: ${{ github.workspace }}
      run: python3 "$RUNNER_TEMP/cmsis-pack-test/probe.py" --probe-finish
run-name: CMSIS 6.4.0 qualification - SimpleTZ-CI.yml
