            prepare()
            bindir = HOME/'bin'; bindir.mkdir(exist_ok=True)
            if not (HOME/'real-cbuild.txt').exists():
                real = shutil.which('cbuild')
                if not real:
                    raise RuntimeError('cbuild unavailable at qualification setup')
                (HOME/'real-cbuild.txt').write_text(real)
                wrapper_path = bindir/'cbuild'
                wrapper_path.write_text('#!/bin/sh\nexec python3 "' + str(HOME/'probe.py') + '" "$@"\n')
                wrapper_path.chmod(0o755)
                with open(os.environ['GITHUB_PATH'], 'a') as f:
                    f.write(str(bindir)+'\n')
            print('CMSIS_PACK_TEST_SETUP target=' + TARGET, flush=True)

        def finish():
            path = HOME/'evidence.jsonl'
            if not path.exists():
                print('::error::No instrumented cbuild invocation reached; CMSIS 6.4.0 not verified')
                return 1
